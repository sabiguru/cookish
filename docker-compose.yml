version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cookish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookish
      POSTGRES_PASSWORD: cookish_password
      POSTGRES_DB: cookish
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cookish-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: cookish-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - cookish-network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cookish-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cookish:cookish_password@postgres:5432/cookish?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: production
    depends_on:
      - postgres
      - minio
    networks:
      - cookish-network

volumes:
  postgres_data:
  minio_data:

networks:
  cookish-network:
    driver: bridge
